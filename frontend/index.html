  <!-- AdminLTE 4 app-level polish (Bootstrap 5 dropped some AdminLTE 3 defaults) -->
  <style>
    /* Drop the per-page title header (AdminLTE 4 `.app-content-header`) app-wide
       — the content moves up and reclaims the vertical space. */
    .app-content-header { display: none; }
    /* Small breathing room now that the header gap is gone. */
    .app-content { padding-top: 1rem; }
    /* Restore AdminLTE 3's per-card bottom margin (Bootstrap 5 `.card` has none,
       so stacked cards stuck together after the migration). */
    .card { margin-bottom: 1rem; }
    /* select2 dropdown must render above Bootstrap 5 modals (z-index 1055). */
    .select2-container--open { z-index: 1060; }
    /* AdminLTE 4 sidebar: constrain the user-panel avatar + brand logo
       (AdminLTE 3 sized these via its own CSS which AdminLTE 4 dropped). */
    .app-sidebar .user-panel { align-items: center; }
    .app-sidebar .user-panel .image img { width: 2.1rem; height: 2.1rem; object-fit: cover; }
    .app-sidebar .user-panel .info { padding-left: 0.6rem; }
    .app-sidebar .user-panel .info a { color: #c2c7d0; }
    .sidebar-brand .brand-image { max-height: 33px; width: auto; }
    /* Card loading overlay (bambooo Card.showLoading): AdminLTE 3 laid the
       spinner absolutely over the card; AdminLTE 4 dropped that rule, so the
       div sat in the normal flow, pushed the table down on every reload and
       caused a second scrollbar. Restore the overlay on top of the card. */
    .card > .overlay {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(var(--bs-body-bg-rgb), 0.6);
        border-radius: inherit;
    }
  </style>

  <!-- jQuery (bambooo + select2 + summernote + daterangepicker rely on it) -->

  <script>

  </script>
